<table class="table">
  <thead>
  <tr>
    <th scope="col">ID Auteur</th>
    <th scope="col">Auteur Nom</th>
    <th scope="col">Nationalité</th>
  </tr>
  </thead>
  <tbody>
    @for (auteur of auteurList; track $index) {
      <tr>
        <th scope="row">{{auteur.id}}</th>
        <td>{{auteur.nom}} {{auteur.prenom}}</td>
        <td>{{auteur.nationalite}}</td>
      </tr>
    }
  </tbody>
</table>
