<table class="table">
  <thead>
  <tr>
    <th scope="col">ID Maison d'édition</th>
    <th scope="col">Maison d'édition nom</th>
    <th scope="col">Maison d'édition pays</th>
  </tr>
  </thead>
  <tbody>
    @for (maisonEdition of maisonEditionList; track $index) {

        <td>{{maisonEdition.pays}}</td>
      </tr>
    }
  </tbody>
</table>
